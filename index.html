<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c5cbf">
<title>만화 데이터베이스</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#7c5cbf;--purple-light:#9b7fd4;--purple-bg:#f3effe;--purple-dark:#5a3fa0;
  --bg:#f7f7f7;--surface:#fff;--border:#e8e8e8;--text:#1a1a1a;--muted:#888;--hint:#bbb;
  --r:10px;--r-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}

.layout{display:flex;height:100dvh;overflow:hidden}

/* sidebar */
.sidebar{width:180px;min-width:180px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:14px 0;transition:transform .25s}
.sidebar-logo{display:flex;align-items:center;gap:7px;padding:0 14px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);margin-bottom:10px}
.sidebar-logo-icon{width:28px;height:28px;background:var(--purple);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.add-btn{margin:0 12px 12px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);padding:8px 0;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s}
.add-btn:hover{background:var(--purple-dark)}
.search-wrap{margin:0 12px 12px;position:relative}
.search-wrap input{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 8px 7px 28px;font-size:12px;outline:none;background:var(--bg);color:var(--text)}
.search-wrap input:focus{border-color:var(--purple)}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:14px}
.sidebar-section{padding:0 14px;margin-bottom:2px}
.sidebar-section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.sidebar-item{display:flex;align-items:center;justify-content:space-between;padding:6px 7px;border-radius:var(--r-sm);cursor:pointer;font-size:12px;color:var(--text);transition:background .1s;margin-bottom:2px;user-select:none}
.sidebar-item:hover{background:var(--purple-bg)}
.sidebar-item.active{background:var(--purple-bg);color:var(--purple);font-weight:600}
.sidebar-count{font-size:11px;background:var(--purple-bg);color:var(--purple);border-radius:10px;padding:1px 7px;font-weight:600}
.sidebar-item.active .sidebar-count{background:var(--purple);color:#fff}
.sidebar-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-divider{border:none;border-top:1px solid var(--border);margin:10px 12px}
.sidebar-label{font-size:11px;padding:4px 7px;cursor:pointer;border-radius:var(--r-sm);transition:background .1s;display:inline-flex;align-items:center;gap:3px;color:var(--muted);margin-bottom:2px;user-select:none}
.sidebar-label:hover{background:var(--purple-bg);color:var(--purple)}
.sidebar-label.active{background:var(--purple-bg);color:var(--purple);font-weight:600}
.tags-wrap{display:flex;flex-wrap:wrap;gap:2px;padding:0 6px}
.sb-dropdown{margin:0 12px 8px;position:relative}
.sb-dropdown-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text);transition:border-color .15s;user-select:none}
.sb-dropdown-btn:hover{border-color:var(--purple)}
.sb-dropdown-btn.active{border-color:var(--purple);background:var(--purple-bg);color:var(--purple);font-weight:600}
.sb-dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:hidden}
.sb-dropdown-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:12px;cursor:pointer;transition:background .1s;color:var(--text)}
.sb-dropdown-item:hover{background:var(--purple-bg);color:var(--purple)}
.sb-dropdown-item.active{background:var(--purple-bg);color:var(--purple);font-weight:600}
.sb-count{font-size:11px;background:var(--purple-bg);color:var(--purple);border-radius:10px;padding:1px 6px;font-weight:600}
.sb-dropdown-item.active .sb-count{background:var(--purple);color:#fff}
.tag-pick-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag-pick{font-size:12px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;font-weight:500;transition:all .15s;user-select:none;opacity:.5}
.tag-pick:hover{opacity:.85}
.tag-pick.selected{opacity:1;border-color:rgba(0,0,0,.15)}
.serial-wrap{display:flex;gap:6px;margin-top:4px}
.serial-btn{font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-weight:500;transition:all .15s;user-select:none}
.serial-btn:hover{border-color:var(--purple);color:var(--purple)}
.serial-btn.selected{background:#e8f5e9;border-color:#43a047;color:#2e7d32}

/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted);transition:all .15s}
.chip.active{background:var(--purple-bg);border-color:var(--purple);color:var(--purple);font-weight:500}
.sort-select{font-size:12px;border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 8px;background:var(--surface);color:var(--text);outline:none;cursor:pointer}
.content-area{flex:1;overflow-y:auto;padding:18px}

/* cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.manga-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.manga-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card-cover{width:100%;aspect-ratio:2/3;background:#eee;position:relative;overflow:hidden}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block}
.card-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8e0f5,#d4c8ef);color:var(--purple);font-size:32px}
.card-score{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fbbf24;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;display:flex;align-items:center;gap:2px}
.card-body{padding:9px 10px}
.card-title{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-author{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.card-footer{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.status-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.card-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.card-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--purple-bg);color:var(--purple)}
.card-date{font-size:10px;color:var(--hint);margin-top:4px}

/* modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(4px)}

/* detail modal */
.detail-modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.modal-top{padding:22px 22px 0;display:flex;gap:18px;align-items:flex-start}
.modal-cover{width:100px;height:150px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,#e8e0f5,#d4c8ef);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--purple);font-size:36px}
.modal-cover img{width:100%;height:100%;object-fit:cover}
.modal-info{flex:1;min-width:0}
.modal-title{font-size:20px;font-weight:700;margin-bottom:3px;line-height:1.3}
.modal-author{font-size:13px;color:var(--muted);margin-bottom:12px}
.modal-badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.modal-score{display:inline-flex;align-items:center;gap:4px;background:var(--purple-bg);color:var(--purple);font-size:14px;font-weight:700;padding:5px 12px;border-radius:7px}
.modal-status{font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px}
.modal-date{font-size:12px;color:var(--muted)}
.modal-section{padding:14px 22px;border-top:1px solid var(--border)}
.modal-section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-tag{font-size:12px;padding:4px 12px;border-radius:5px;background:var(--purple-bg);color:var(--purple);font-weight:600}
.modal-desc{font-size:13px;line-height:1.9;color:var(--text)}
.modal-comment{font-size:13px;line-height:1.8;background:var(--bg);padding:12px 14px;border-radius:var(--r-sm);border-left:3px solid var(--purple)}
.modal-close{position:absolute;top:14px;right:14px;background:var(--bg);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--muted);transition:background .15s}
.modal-close:hover{background:var(--border)}
.modal-actions{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* add modal */
.add-modal{background:var(--surface);border-radius:14px;width:100%;max-width:500px;max-height:90dvh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.add-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.add-modal-title{font-size:15px;font-weight:700}
.add-modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.form-group label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;outline:none;background:var(--surface);color:var(--text);transition:border-color .15s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--purple)}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-results-list{border:1px solid var(--border);border-radius:var(--r-sm);max-height:200px;overflow-y:auto;margin-top:6px}
.search-result-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}
.search-result-row:last-child{border-bottom:none}
.search-result-row:hover{background:var(--purple-bg)}
.sr-img{width:34px;height:50px;object-fit:cover;border-radius:3px;background:var(--bg);flex-shrink:0}
.sr-info-title{font-size:12px;font-weight:600;line-height:1.4}
.sr-info-author{font-size:11px;color:var(--muted)}
.star-row{display:flex;gap:2px}
.star-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--hint);padding:0 1px;line-height:1;transition:color .1s}
.star-btn.on{color:#fbbf24}
.add-modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}

/* buttons */
.btn{font-size:13px;padding:7px 16px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg)}
.btn-purple{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-purple:hover{background:var(--purple-dark)}
.btn-danger{color:#ef4444;border-color:#fca5a5}
.btn-danger:hover{background:#fef2f2}

/* setup */
.setup-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px}
.setup-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.code-block{font-family:monospace;font-size:11px;background:var(--bg);padding:8px 10px;border-radius:var(--r-sm);color:var(--text);margin-top:4px;word-break:break-all;border:1px solid var(--border)}

/* mobile menu btn */
.menu-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px}

/* empty */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty i{font-size:48px;display:block;margin-bottom:12px;color:var(--hint)}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}

/* mobile sidebar overlay */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;backdrop-filter:blur(2px)}

@media(max-width:640px){
  .sidebar{position:fixed;left:0;top:0;height:100dvh;z-index:100;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .menu-btn{display:flex}
  .content-area{padding:12px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .modal-overlay{padding:8px;align-items:flex-end}
  .detail-modal,.add-modal{border-radius:14px 14px 0 0;max-height:95dvh}
  .setup-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="layout" id="app"></div>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<script>
const STATUS={
  reading:{label:'읽는 중',color:'#7c5cbf',bg:'#f3effe'},
  done:{label:'완독',color:'#3b82f6',bg:'#eff6ff'},
  plan:{label:'예정',color:'#94a3b8',bg:'#f1f5f9'},
  dropped:{label:'중단',color:'#ef4444',bg:'#fef2f2'}
};
const SERIAL={
  finished:{label:'완결',color:'#388e3c',bg:'#e8f5e9'},
  ongoing:{label:'연재 중',color:'#1976d2',bg:'#e3f2fd'},
  hiatus:{label:'연재중단',color:'#e64a19',bg:'#fbe9e7'},
};
const TAG_COLORS={
  '액션':  {bg:'#fdecea',color:'#c62828'},   // 빨강
  '판타지':{bg:'#ede7f6',color:'#4527a0'},   // 보라
  '일상':  {bg:'#e8f5e9',color:'#2e7d32'},   // 초록
  '코미디':{bg:'#e1f5fe',color:'#0277bd'},   // 하늘 (일상과 구분)
  '힐링':  {bg:'#fce4ec',color:'#ad1457'},   // 핑크 (코미디와 구분)
  '요리':  {bg:'#fff3e0',color:'#e65100'},   // 주황
  '학교':  {bg:'#f3e5f5',color:'#6a1b9a'},   // 연보라 (요리와 구분)
  '미스터리':{bg:'#263238',color:'#b0bec5'}, // 다크 차콜
  '로맨스':{bg:'#fce4ec',color:'#c2185b'},   // 딥핑크
  'SF':    {bg:'#e8eaf6',color:'#283593'},   // 인디고 (로맨스와 구분)
  '스포츠':{bg:'#e8f5e9',color:'#1b5e20'},   // 진초록
  '소년':  {bg:'#fff8e1',color:'#ff8f00'},   // 앰버 (스포츠와 구분)
  '스릴러':{bg:'#efebe9',color:'#4e342e'},   // 브라운 (소년과 구분)
  '도박':  {bg:'#212121',color:'#eeeeee'},   // 다크 (스릴러와 구분)
  '드라마':{bg:'#e0f2f1',color:'#00695c'},   // 틸
  '성인':  {bg:'#fafafa',color:'#757575'},
};
const PRESET_TAGS=['액션','판타지','일상','코미디','힐링','요리','학교','미스터리','로맨스','SF','스포츠','소년','스릴러','도박','드라마'];
function tagStyle(t){const c=TAG_COLORS[t];return c?`background:${c.bg};color:${c.color}`:`background:var(--purple-bg);color:var(--purple)`;}

// 로컬스토리지에서 데이터 불러오기
function loadData(){
  try{const d=localStorage.getItem('manga-db-data');return d?JSON.parse(d):getDefaultData()}
  catch(e){return getDefaultData()}
}
function saveData(){
  try{localStorage.setItem('manga-db-data',JSON.stringify(S.data))}catch(e){}
}
function loadSettings(){
  try{const d=localStorage.getItem('manga-db-settings');return d?JSON.parse(d):{aladinKey:'',sheetsId:'',sheetsKey:''}}
  catch(e){return{aladinKey:'',sheetsId:'',sheetsKey:''}}
}
function saveSettings(){
  try{localStorage.setItem('manga-db-settings',JSON.stringify({aladinKey:S.aladinKey,sheetsId:S.sheetsId,sheetsKey:S.sheetsKey}))}catch(e){}
}

function getDefaultData(){
  return [
    {id:1,title:'황천의 초가이',author:'아라카와 히로무',cover:'',status:'reading',score:5,note:'정말 재미있음. 작가 특유의 세계관',tags:['판타지','액션'],desc:'황천에서 살아남으려는 소녀의 이야기.',date:'2026.05.07'},
    {id:2,title:'콘즈쿠시',author:'노나라 이누유',cover:'',status:'reading',score:5,note:'치유물 최고',tags:['요리','힐링'],desc:'여우 전문 학교에 인간이 몰래 입학하는 이야기.',date:'2025.11.15'},
    {id:3,title:'닌자와 극도',author:'콘도 신스케',cover:'',status:'reading',score:4,note:'배틀 전개가 쌈마이하지만 그게 매력',tags:['배틀','액션'],desc:'현대를 배경으로 닌자와 야쿠자가 배틀을 펼치는 만화.',date:'2025.10.16'},
    {id:4,title:'체인소 맨',author:'후지모토 타츠키',cover:'',status:'done',score:4.5,note:'1부 완결. 전개가 미침',tags:['액션','다크'],desc:'악마 사냥꾼이 되어버린 소년의 피튀기는 액션.',date:'2025.01.01'},
    {id:5,title:'스파이×패밀리',author:'엔도 타츠야',cover:'',status:'reading',score:4,note:'아냐 너무 귀엽다',tags:['코미디','일상'],desc:'스파이가 가족을 꾸리는 이야기.',date:'2025.03.10'},
    {id:6,title:'헌터×헌터',author:'토가시 요시히로',cover:'',status:'reading',score:5,note:'휴재왕...그래도 기다림',tags:['배틀','판타지'],desc:'헌터가 되기 위한 소년의 모험.',date:'2024.12.01'},
  ];
}

const settings=loadSettings();
let S={
  data:loadData(),
  filterStatus:'all',
  filterSerial:'all',
  filterScore:'all',
  filterTag:'all',
  ddOpen:null,
  searchQ:'',
  sortBy:'score',
  modal:null,
  detailId:null,
  addForm:emptyForm(),
  editId:null,
  searchResults:[],
  searchLoading:false,
  showSetup:false,
  aladinKey:settings.aladinKey,
  sheetsId:settings.sheetsId,
  sheetsKey:settings.sheetsKey,
};

function statusCount(k){return S.data.filter(m=>m.status===k).length}

function filtered(){
  let d=[...S.data];
  if(S.filterStatus!=='all')d=d.filter(m=>m.status===S.filterStatus);
  if(S.filterScore!=='all'){
    if(S.filterScore==='4.5')d=d.filter(m=>m.score>=4.5);
    else if(S.filterScore==='3.5')d=d.filter(m=>m.score>=3.5&&m.score<4.5);
    else if(S.filterScore==='2.5')d=d.filter(m=>m.score>=2.5&&m.score<3.5);
    else if(S.filterScore==='2')d=d.filter(m=>m.score<2.5&&m.score>0);
  }
  if(S.filterSerial!=='all')d=d.filter(m=>m.serial===S.filterSerial);
  if(S.filterTag!=='all')d=d.filter(m=>(m.tags||[]).includes(S.filterTag));
  if(S.searchQ){const q=S.searchQ.toLowerCase();d=d.filter(m=>m.title.toLowerCase().includes(q)||(m.author||'').toLowerCase().includes(q))}
  if(S.sortBy==='score')d.sort((a,b)=>b.score-a.score);
  else if(S.sortBy==='title')d.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  return d;
}

// helpers
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function openSidebar(){document.getElementById('sidebar')?.classList.add('open');document.getElementById('sidebar-overlay')?.classList.add('open')}
function closeSidebar(){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('sidebar-overlay')?.classList.remove('open')}
function openAdd(){S.addForm=emptyForm();S.editId=null;S.searchResults=[];S.modal='add';render()}
function closeModal(){S.modal=null;S.detailId=null;S.editId=null;S.searchResults=[];render()}
function openDetail(id){S.detailId=id;S.modal='detail';render()}
function startEdit(id){
  const m=S.data.find(x=>x.id===id);
  S.addForm={...m,tags:[...(m.tags||[])],serial:m.serial||''};
  S.editId=id;S.modal='add';render();
}
function setScore(n){S.addForm.score=n;render()}
function toggleTag(t){
  let tags=Array.isArray(S.addForm.tags)?[...S.addForm.tags]:(S.addForm.tags||'').split(',').map(x=>x.trim()).filter(Boolean);
  const idx=tags.indexOf(t);
  if(idx>=0)tags.splice(idx,1);
  else tags.push(t);
  S.addForm.tags=tags;
  render();
}
function clickStar(e,i){
  const rect=e.currentTarget.getBoundingClientRect();
  const half=e.clientX-rect.left < rect.width/2;
  S.addForm.score=half?i+0.5:i+1;
  render();
}
function hoverStar(e,i){
  const rect=e.currentTarget.getBoundingClientRect();
  const half=e.clientX-rect.left < rect.width/2;
  const score=half?i+0.5:i+1;
  document.querySelectorAll('#star-row span[onmousemove]').forEach((el,idx)=>{
    const full=score>=idx+1;
    const h=!full&&score>=idx+0.5;
    const fill=el.querySelector('span:last-child');
    if(fill)fill.style.width=full?'100%':h?'50%':'0%';
  });
}
function unhoverStar(){render();}
function deleteManga(id){
  if(!confirm('삭제할까요?'))return;
  S.data=S.data.filter(x=>x.id!==id);
  saveData();closeModal();
}
function saveManga(){
  const f=S.addForm;
  if(!f.title.trim()){alert('제목을 입력해주세요');return}
  const tags=Array.isArray(f.tags)?f.tags:(typeof f.tags==='string'?f.tags.split(',').map(t=>t.trim()).filter(Boolean):[]);
  const today=new Date();
  const date=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const record={...f,tags,score:+f.score||0};
  if(S.editId){
    const i=S.data.findIndex(x=>x.id===S.editId);
    if(i>=0)S.data[i]={...S.data[i],...record};
  }else{
    record.id=Date.now();record.date=date;
    S.data.unshift(record);
  }
  saveData();
  syncToSheets(record);
  closeModal();
}

async function doSearch(){
  const q=document.getElementById('aladin-q')?.value?.trim();
  if(!q)return;
  S.searchLoading=true;S.searchResults=[];render();
  if(!S.aladinKey){
    S.searchResults=[{title:q+' (예시)',author:'API 키 없음 — 직접 입력해주세요',cover:'',isbn:''}];
    S.searchLoading=false;render();return;
  }
  const apiUrl=`http://www.aladin.co.kr/ttb/api/ItemSearch.aspx?ttbkey=${S.aladinKey}&Query=${encodeURIComponent(q)}&QueryType=Title&MaxResults=15&SearchTarget=Book&CategoryId=2551&output=js&Version=20131101`;
  const proxies=[
    `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,
  ];
  let data=null;
  for(const proxy of proxies){
    try{
      const res=await fetch(proxy);
      const text=await res.text();
      data=JSON.parse(text);
      if(data&&data.item)break;
    }catch(e){data=null;}
  }
  if(data&&data.item&&data.item.length){
    S.searchResults=data.item.map(i=>({
      title:(i.title||'').trim(),
      author:(i.author||'').replace(/\s*\(.*?\)/g,'').trim(),
      cover:(i.cover||'').replace('http://','https://').replace('coversum','cover200'),
      isbn:i.isbn13||i.isbn||'',
      desc:i.description||''
    }));
  }else{
    S.searchResults=[{title:'검색 실패',author:'잠시 후 다시 시도해주세요',cover:'',isbn:''}];
  }
  S.searchLoading=false;render();
}

function cleanTitle(t){
  // "제목 32", "제목 32권", "제목 - 32", "제목 : 32권" 등 제거
  // 단, "진격의 거인", "Re:제로" 같은 제목은 건드리지 않음
  return (t||'')
    .replace(/\s+\d+권\s*[-:]?.*$/, '')   // "32권" 이후 전부
    .replace(/\s+\d+\s*[-:]\s*.{0,10}$/, m => {
      // "32 - 부제목" 형식 — 숫자 뒤 텍스트가 짧으면 부제목으로 판단해 제거
      return '';
    })
    .replace(/\s+\d+$/, '')               // 끝에 숫자만 있는 경우
    .trim();
}

function pickResult(i){
  const r=S.searchResults[i];
  S.addForm.title=document.getElementById('aladin-q')?.value?.trim()||r.title;
  S.addForm.author=r.author;
  S.addForm.cover=r.cover;
  S.addForm.desc=r.desc||'';
  S.searchResults=[];render();
  if(r.isbn&&S.aladinKey){
    fetchDesc(r.isbn);
  }
}



async function fetchDesc(isbn){
  if(!isbn||!S.aladinKey)return;
  const apiUrl=`http://www.aladin.co.kr/ttb/api/ItemLookUp.aspx?ttbkey=${S.aladinKey}&itemIdType=ISBN13&ItemId=${isbn}&output=js&Version=20131101&OptResult=description`;
  const proxies=[
    `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,
  ];
  for(const proxy of proxies){
    try{
      const res=await fetch(proxy);
      const text=await res.text();
      const data=JSON.parse(text);
      const item=(data.item||[])[0];
      if(item&&item.description&&item.description.length>10){
        S.addForm.desc=item.description;
        render();
        return;
      }
    }catch(e){}
  }
}

async function syncToSheets(record){
  if(!S.sheetsId||!S.sheetsKey)return;
  try{
    const range='Sheet1!A:J';
    const row=[record.id,record.title,record.author,record.cover,record.status,record.score,record.note,(record.tags||[]).join(','),record.desc,record.date];
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${S.sheetsId}/values/${range}:append?valueInputOption=RAW&key=${S.sheetsKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({values:[row]})
    });
  }catch(e){}
}

render();
</script>
