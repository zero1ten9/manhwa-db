window.doImport = async function() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.style.display = 'block';
  log.innerHTML = '시작합니다...<br>';

  let ok = 0, fail = 0;
  for(const item of data) {
    try {
      const {id, ...rest} = item;
      await addDoc(collection(db, 'manga'), rest);
      ok++;
      log.innerHTML += `<span class="ok">✓ ${item.title}</span><br>`;
      log.scrollTop = log.scrollHeight;
    } catch(e) {
      fail++;
      log.innerHTML += `<span class="err">✗ ${item.title}: ${e.message}</span><br>`;
    }
    await new Promise(r => setTimeout(r, 100));
  }
  log.innerHTML += `<br><strong>완료! 성공 ${ok}개 / 실패 ${fail}개</strong>`;
  btn.textContent = '완료!';
};
